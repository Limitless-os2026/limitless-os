<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New emergency, phone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#2A5120}a:hover{color:#183313}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4EF; color: #1B241A; font-family: 'Barlow', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.35">
<header style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px; background: #183313; color: #FFFFFF">
<a href="office-home.html" aria-label="Cancel" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 22px">New emergency</h1>
</header>
<form style="flex: 1; min-height: 0; margin: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px; font-weight: 500">Customer name<input type="text" autocomplete="off" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 400; color: #1B241A"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-weight: 500">Phone<input type="tel" autocomplete="off" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 400; color: #1B241A"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-weight: 500">Address<input type="text" autocomplete="off" placeholder="Start typing, then pick from the list" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 400; color: #1B241A"></label>
<div role="group" aria-label="Emergency type" style="display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 500">Emergency type</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; border: 2px solid #1B241A; border-radius: 6px; background: #1B241A; color: #FFFFFF; font: inherit; font-weight: 600">Tarp</button>
<button type="button" aria-pressed="false" style="min-height: 44px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; color: #1B241A; font: inherit">Board-up</button>
<button type="button" aria-pressed="false" style="min-height: 44px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; color: #1B241A; font: inherit">Tree impact</button>
<button type="button" aria-pressed="false" style="min-height: 44px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; color: #1B241A; font: inherit">Stabilization</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span id="sent-by-label" style="font-weight: 500">Sent by</span>
<button type="button" aria-labelledby="sent-by-label" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; padding: 0 12px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; color: #4A5547; font: inherit; text-align: left">Pick a partner and contact<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-weight: 500">Notes for the crew<textarea rows="2" placeholder="What happened, access, anything they should know" style="min-height: 72px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #AEB8A7; border-radius: 6px; background: #FFFFFF; font: inherit; font-weight: 400; color: #1B241A; resize: none"></textarea></label>
<a href="#" style="display: flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none">Add loss type, carrier or photos</a>
</form>
<div style="padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; background: #FFFFFF; border-top: 1px solid #D9DED4">
<a href="technician-job-phone.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 6px; background: #F5C400; color: #1B241A; font-weight: 600; font-size: 18px; text-decoration: none">Create and pick a crew</a>
<div style="color: #4A5547; font-size: 14px; text-align: center">The job number and time received fill in on their own.</div>
</div>
</div>
</body>
</html>
